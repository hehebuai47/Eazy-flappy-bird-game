<meta name="theme-color" content="#7ec8e3">

<style>
  :root {
    --sky1: #7ec8e3;
    --sky2: #bfe9f7;
    --pipe: #4caf50;
    --pipe-dark: #388e3c;
    --ground: #ded6a3;
    --ground-dark: #c2b280;
    --bird: #ffcc33;
    --bird-dark: #e6a800;
    --text: #2c2c2c;
    --panel-bg: rgba(255,255,255,0.92);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--sky1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 800px;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(var(--sky1), var(--sky2));
    border-radius: 0;
  }
  #hud {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.35), 0 0 2px rgba(0,0,0,0.5);
    pointer-events: none;
    user-select: none;
  }
  #phaseHud {
    position: absolute;
    top: calc(70px + env(safe-area-inset-top, 0px));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.35);
    pointer-events: none;
    user-select: none;
  }
  #panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    border-radius: 20px;
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    max-width: 80%;
  }
  #panel h1 {
    margin: 0 0 8px;
    font-size: 26px;
    color: var(--text);
  }
  #panel p {
    margin: 4px 0;
    color: #555;
    font-size: 15px;
  }
  #panel .score-line {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-top: 10px;
  }
  #panel button {
    margin-top: 18px;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    background: var(--bird);
    color: #4a3200;
    box-shadow: 0 4px 0 var(--bird-dark);
    cursor: pointer;
  }
  #panel button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--bird-dark);
  }
  #footer-hint {
    position: absolute;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    pointer-events: none;
    user-select: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel-bg: rgba(40,40,40,0.92);
      --text: #eee;
    }
    :root:not([data-theme="light"]) #panel p { color: #bbb; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">0</div>
  <div id="phaseHud">Fase 1 · 0/5</div>
  <div id="panel">
    <h1>🐤 Flappy Fácil</h1>
    <p>Toque ou aperte espaço pra voar.</p>
    <p>Os canos são bem largos, relaxa.</p>
    <div class="score-line" id="bestLine"></div>
    <button id="startBtn">Jogar</button>
  </div>
  <div id="footer-hint">toque na tela para pular</div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const hud = document.getElementById('hud');
  const phaseHud = document.getElementById('phaseHud');
  const panel = document.getElementById('panel');
  const startBtn = document.getElementById('startBtn');
  const bestLine = document.getElementById('bestLine');
  const footerHint = document.getElementById('footer-hint');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---- Config (modo fácil) ----
  const GRAVITY = 1500;      // px/s^2
  const FLAP_VELOCITY = -420; // px/s
  const MAX_FALL_SPEED = 620;
  const PIPE_GAP = 230;       // bem largo
  const PIPE_SPEED = 140;     // px/s
  const PIPE_INTERVAL = 1500; // ms entre canos
  const PIPE_WIDTH = 70;
  const GROUND_HEIGHT = 70;
  const BIRD_RADIUS = 16;
  const BIRD_X_RATIO = 0.3;

  let bird, pipes, score, best, state, lastTime, pipeTimer, groundOffset;
  let phase, pipesInPhase, pipesNeeded;

  function pipesNeededForPhase(ph) {
    return 5 + Math.floor((ph - 1) / 5);
  }

  function updatePhaseHud() {
    phaseHud.textContent = 'Fase ' + phase + ' · ' + pipesInPhase + '/' + pipesNeeded;
  }

  function loadBest() {
    try {
      const v = localStorage.getItem('flappyFacilBest');
      return v ? parseInt(v, 10) : 0;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('flappyFacilBest', String(v)); } catch (e) {}
  }
  best = loadBest();

  function reset() {
    bird = {
      x: W * BIRD_X_RATIO,
      y: H / 2,
      vy: 0,
      rotation: 0
    };
    pipes = [];
    score = 0;
    pipeTimer = 0;
    groundOffset = 0;
    phase = 1;
    pipesInPhase = 0;
    pipesNeeded = pipesNeededForPhase(phase);
    hud.textContent = '0';
    updatePhaseHud();
    phaseHud.style.display = 'block';
  }

  function spawnPipe() {
    const margin = 60;
    const playH = H - GROUND_HEIGHT;
    const centerMin = margin + PIPE_GAP / 2;
    const centerMax = playH - margin - PIPE_GAP / 2;
    const center = centerMin + Math.random() * Math.max(1, (centerMax - centerMin));
    pipes.push({ x: W + PIPE_WIDTH, gapCenter: center, passed: false });
  }

  function flap() {
    if (state === 'playing') {
      bird.vy = FLAP_VELOCITY;
    } else if (state === 'ready' || state === 'over') {
      startGame();
      bird.vy = FLAP_VELOCITY;
    }
  }

  function startGame() {
    reset();
    state = 'playing';
    panel.style.display = 'none';
    footerHint.style.display = 'block';
  }

  function completePhase() {
    state = 'phaseComplete';
    pipes = [];
    pipeTimer = 0;
    document.querySelector('#panel h1').textContent = 'Fase ' + phase + ' completa! 🎉';
    document.querySelector('#panel p').textContent = 'Vem a fase ' + (phase + 1) + ', com mais um cano.';
    document.querySelectorAll('#panel p')[1].style.display = 'none';
    bestLine.textContent = 'Pontos até aqui: ' + score + (best > 0 ? '   ·   Recorde: ' + best : '');
    startBtn.textContent = 'Continuar';
    panel.style.display = 'block';
  }

  function nextPhase() {
    phase++;
    pipesInPhase = 0;
    pipesNeeded = pipesNeededForPhase(phase);
    updatePhaseHud();
    state = 'playing';
    panel.style.display = 'none';
  }

  function endGame() {
    state = 'over';
    if (score > best) {
      best = score;
      saveBest(best);
    }
    bestLine.textContent = 'Recorde: ' + best + '   ·   Essa: ' + score;
    document.querySelector('#panel h1').textContent = score === 0 ? 'Foi essa 😅' : 'Boa! 🎉';
    document.querySelector('#panel p').textContent = 'Toca em jogar pra tentar de novo.';
    document.querySelectorAll('#panel p')[1].style.display = 'none';
    startBtn.textContent = 'Jogar de novo';
    panel.style.display = 'block';
  }

  function update(dt) {
    if (state !== 'playing') return;

    bird.vy += GRAVITY * dt;
    if (bird.vy > MAX_FALL_SPEED) bird.vy = MAX_FALL_SPEED;
    bird.y += bird.vy * dt;
    bird.rotation = Math.max(-0.5, Math.min(0.9, bird.vy / 500));

    groundOffset = (groundOffset + PIPE_SPEED * dt) % 40;

    pipeTimer += dt * 1000;
    if (pipeTimer >= PIPE_INTERVAL) {
      pipeTimer = 0;
      spawnPipe();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED * dt;

      if (!p.passed && p.x + PIPE_WIDTH / 2 < bird.x) {
        p.passed = true;
        score++;
        hud.textContent = score;
        pipesInPhase++;
        updatePhaseHud();
        if (pipesInPhase >= pipesNeeded) {
          completePhase();
          return;
        }
      }

      if (p.x < -PIPE_WIDTH) {
        pipes.splice(i, 1);
      }
    }

    // Colisões - um pouco de margem pra ser mais fácil
    const forgiveness = 4;
    const playH = H - GROUND_HEIGHT;

    if (bird.y + BIRD_RADIUS - forgiveness > playH) {
      bird.y = playH - BIRD_RADIUS;
      endGame();
      return;
    }
    if (bird.y - BIRD_RADIUS < 0) {
      bird.y = BIRD_RADIUS;
      bird.vy = 0;
    }

    for (const p of pipes) {
      const withinX = bird.x + BIRD_RADIUS - forgiveness > p.x - PIPE_WIDTH / 2 &&
                       bird.x - BIRD_RADIUS + forgiveness < p.x + PIPE_WIDTH / 2;
      if (withinX) {
        const topEdge = p.gapCenter - PIPE_GAP / 2;
        const botEdge = p.gapCenter + PIPE_GAP / 2;
        if (bird.y - BIRD_RADIUS + forgiveness < topEdge || bird.y + BIRD_RADIUS - forgiveness > botEdge) {
          endGame();
          return;
        }
      }
    }
  }

  function drawBackgroundClouds(t) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    const cloudPositions = [
      { x: (W * 0.2 + t * 10) % (W + 100) - 50, y: H * 0.18, r: 22 },
      { x: (W * 0.6 + t * 6) % (W + 140) - 70, y: H * 0.3, r: 30 },
      { x: (W * 0.85 + t * 14) % (W + 100) - 50, y: H * 0.12, r: 18 }
    ];
    for (const c of cloudPositions) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.arc(c.x + c.r * 0.8, c.y + 4, c.r * 0.7, 0, Math.PI * 2);
      ctx.arc(c.x - c.r * 0.8, c.y + 6, c.r * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPipe(p) {
    const topEdge = p.gapCenter - PIPE_GAP / 2;
    const botEdge = p.gapCenter + PIPE_GAP / 2;
    const x = p.x - PIPE_WIDTH / 2;

    ctx.fillStyle = getCss('--pipe');
    ctx.fillRect(x, 0, PIPE_WIDTH, topEdge);
    ctx.fillRect(x, botEdge, PIPE_WIDTH, H - GROUND_HEIGHT - botEdge);

    ctx.fillStyle = getCss('--pipe-dark');
    ctx.fillRect(x - 4, topEdge - 22, PIPE_WIDTH + 8, 22);
    ctx.fillRect(x - 4, botEdge, PIPE_WIDTH + 8, 22);
  }

  function drawGround() {
    ctx.fillStyle = getCss('--ground');
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
    ctx.fillStyle = getCss('--ground-dark');
    for (let x = -groundOffset; x < W; x += 40) {
      ctx.fillRect(x, H - GROUND_HEIGHT, 20, 8);
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);
    ctx.fillStyle = getCss('--bird');
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    // asa
    ctx.fillStyle = getCss('--bird-dark');
    ctx.beginPath();
    ctx.ellipse(-2, 4, 8, 5, 0.3, 0, Math.PI * 2);
    ctx.fill();
    // olho
    ctx.fillStyle = '#2c2c2c';
    ctx.beginPath();
    ctx.arc(6, -4, 2.2, 0, Math.PI * 2);
    ctx.fill();
    // bico
    ctx.fillStyle = '#ff8f2b';
    ctx.beginPath();
    ctx.moveTo(BIRD_RADIUS - 2, -2);
    ctx.lineTo(BIRD_RADIUS + 8, 1);
    ctx.lineTo(BIRD_RADIUS - 2, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  let cssCache = {};
  function getCss(varName) {
    if (!cssCache[varName]) {
      cssCache[varName] = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    }
    return cssCache[varName];
  }

  let t0 = 0;
  function draw(elapsedSec) {
    ctx.clearRect(0, 0, W, H);
    drawBackgroundClouds(elapsedSec);
    for (const p of pipes) drawPipe(p);
    drawGround();
    if (bird) drawBird();
  }

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.05) dt = 0.05; // evita saltos grandes
    lastTime = timestamp;
    t0 += dt;

    update(dt);
    draw(t0);

    requestAnimationFrame(loop);
  }

  // ---- Input ----
  function onPointerDown(e) {
    e.preventDefault();
    flap();
  }
  wrap.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });
  startBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
  });
  startBtn.addEventListener('click', () => {
    if (state === 'phaseComplete') {
      nextPhase();
    } else {
      startGame();
    }
  });

  // ---- Init ----
  state = 'ready';
  reset();
  footerHint.style.display = 'none';
  if (best > 0) {
    bestLine.textContent = 'Seu recorde: ' + best;
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
